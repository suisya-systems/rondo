name: ci

# rondo's merge gate.
#
# Read `gate` at the bottom first: everything above it exists to give it
# something to aggregate. The single stable check name is what a branch ruleset
# should require, so that adding a matrix cell is a change to this file alone.
#
# The matrix is not the same on every trigger: a pull request gets the ubuntu
# cells, and the Windows cells run nightly and on demand (D-0087). One workflow
# rather than two, so the steps a Windows cell runs are the steps a pull request
# ran and cannot drift away from them -- see `double-green`'s `os` line.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Windows cells' only scheduled path (D-0087). Nightly at 18:17 UTC,
  # which is 03:17 in the operator's timezone: a red is waiting in the morning
  # rather than arriving mid-afternoon. Offset from the hour on purpose --
  # GitHub queues the top of every hour hardest, and a delayed or dropped
  # nightly is a signal nobody gets.
  #
  # A scheduled workflow runs from the default branch's copy of this file and
  # nowhere else, so a change to the cron below only takes effect once merged.
  schedule:
    - cron: "17 18 * * *"
  # On demand, for the case the schedule exists to make rare: someone touched
  # something platform-shaped and wants the Windows answer before merging
  # rather than the next morning.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `github.event_name` is in the key because the nightly and a push to `main`
  # share a ref: without it a merge would cancel the night's only Windows run,
  # or be cancelled by it, and the cell would be quietly unobserved for a day.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  double-green:
    # Matrix leg names embed the matrix values, so this name is NOT the one a
    # ruleset references -- see `gate`.
    name: double-green (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # The suite parses every module under `src/` through a compiler child
    # process and is under a second of test time. The cap is a floor under
    # runner variance and install time, not a budget to grow into.
    timeout-minutes: 15
    strategy:
      # A red cell must not hide the state of the others: which cells failed is
      # the diagnosis, and cancelling them destroys it.
      fail-fast: false
      matrix:
        # Windows runs on the scheduled and manual triggers only (D-0087). It
        # is not dropped: two things are observed there and nowhere else -- the
        # cp932 console, where a non-ASCII character in program output crashes
        # the writer rather than printing badly (D-0004), and backslash path
        # separators, where the boundary sweep's one normalisation site is the
        # difference between a green cell and a cell in which every relative
        # import in the tree reads as a violation. What changed is WHEN that is
        # checked, and the cost is stated in D-0087: a Windows-only break is
        # now found by the next nightly rather than before the merge that
        # caused it.
        #
        # The expression is the whole mechanism, so read it rather than the
        # prose: on `schedule` and `workflow_dispatch` the list is both, on
        # everything else it is ubuntu alone. Node stays 22 and 24 on every
        # trigger, so a pull request runs two cells and a nightly runs four.
        #
        # The continuation lines below sit at the SAME indentation as the first
        # on purpose: a `>-` scalar folds equally-indented lines into one with
        # spaces, and keeps the newline on any line indented further. A newline
        # inside `${{ ... }}` is not something to find out about from a runner.
        os: >-
          ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && fromJSON('["ubuntu-latest", "windows-latest"]')
          || fromJSON('["ubuntu-latest"]') }}
        # Node 22 (Maintenance LTS) and Node 24 (Active LTS), matching the
        # `engines` range in package.json.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Check the vendored cadenza tarball
        # Immediately before the install, in every job that installs, and never
        # only as a test afterwards (D-0018 rule 4). npm's integrity hash is
        # enforced against its cache: swap the tarball with a COLD cache and
        # `npm ci` fails with EINTEGRITY, but do it with a WARM one and npm
        # exits 0 having installed the bytes it already held. That is integrity
        # working rather than failing, and it makes a drifted tarball loud on a
        # runner and silent on a laptop. This check is cache-independent and
        # says which digest was expected and which was found, where EINTEGRITY
        # reports a base64 hash nobody can read.
        #
        # Node rather than `sha256sum`: coreutils is absent on stock macOS and
        # on Windows, and one of the cells this matrix produces is a Windows
        # cell -- on the nightly and manual triggers (D-0087).
        run: node vendor/pin.mjs check

      - name: Install from the lockfile
        # `npm ci`, never `npm install`: it fails when package.json and
        # package-lock.json disagree, so a dependency cannot drift into a run
        # without appearing in a diff. `--ignore-scripts` is the standing rule
        # (D-0007), not a reaction to a particular package.
        run: npm ci --ignore-scripts

      - name: Build the executable
        # D-0002 objected to "a build that nothing checks"; this is the check
        # (D-0024 rule 4). It is in `double-green` rather than in `checks` so
        # that it runs in every cell the trigger produces: the Node 22/24 split
        # on every trigger, and Windows path handling on the nightly and manual
        # ones (D-0087). The executable is the first thing rondo ships that runs
        # outside vitest.
        run: npm run build

      - name: Check the page's served files against their manifest
        # D-0059 R1's substitute: the browser receives build output (Tailwind's CSS, copies of htmx
        # and two faces), so every served byte is named by sha256 in `page.manifest.json`, and a
        # clean build on the runner has to reproduce it exactly. Right after the build, on a fresh
        # checkout, so nothing but the lockfile and the tree can have produced `dist/page`.
        #
        # In every cell the trigger produces, deliberately. Tailwind's `oxide` and
        # `lightningcss` are native per-platform binaries and reproducibility was measured on one
        # machine only (D-0059 residuals, "cross-platform build reproducibility ... the
        # implementing change's CI"). A Windows cell that emits different CSS bytes is that
        # residual observed, and is D-0059's falsifier for R1 -- which, since D-0087, is a
        # falsifier the nightly can fire and a pull request cannot. Narrowing this step to ubuntu
        # is still a decision to record, not a quiet edit here. A red here is that residual only
        # once line endings are ruled out: `.gitattributes` pins the page's js and css to LF, so a
        # CRLF checkout cannot change keys.js's digest.
        run: npm run page:check

      - name: Type-check
        run: npm run typecheck

      - name: Provision the pinned continuo
        # The seam rondo drives is a subprocess, so the only way to know it
        # works is to run it (D-0017 rule 6). The build happens once per cell,
        # in the runner's own temporary directory: not inside this checkout,
        # where it would contaminate the boundary sweep's directory walk and
        # the working tree, and not in a sibling checkout, which does not exist
        # on a runner.
        #
        # The revision comes from `continuo.pin.json` and is never repeated
        # here -- `test/continuo/pin.test.ts` fails if a full sha appears in
        # this file at all. A detached checkout of that exact commit is what
        # makes the pin a pin rather than a branch that moved.
        #
        # `npm ci --ignore-scripts` is continuo's own install policy and
        # rondo's (D-0007); better-sqlite3 ships prebuilt binaries for the
        # platforms in this matrix, so no lifecycle script has to run for the
        # CLI to open a database. `CONTINUO_REQUIRE_REVISION=1` makes a build
        # that cannot identify itself fail HERE, at build time, instead of
        # surfacing later as rondo refusing to start against `unknown`.
        #
        # bash on both runners, so the Windows cell runs the same three
        # commands rather than a second implementation of them.
        id: continuo
        shell: bash
        run: |
          set -euo pipefail
          revision=$(node -p "require('./continuo.pin.json').revision")
          repository=$(node -p "require('./continuo.pin.json').repository")
          # The destination and the CLI path are computed by NODE, not by the
          # shell. On the Windows cell `RUNNER_TEMP` is a native path with a
          # drive letter and backslashes, and a path assembled in bash there is
          # either a POSIX path Node cannot resolve or a mixed one that only
          # sometimes works. `path.join` answers in the platform's own spelling
          # on both cells, which is the spelling rondo's own absolute-path check
          # accepts and the spelling `spawn` needs.
          checkout=$(node -e 'const {join}=require("node:path");const {tmpdir}=require("node:os");process.stdout.write(join(process.env.RUNNER_TEMP||tmpdir(),"continuo-"+process.argv[1]))' "$revision")
          cli=$(node -e 'const {join}=require("node:path");process.stdout.write(join(process.argv[1],"dist","cli.js"))' "$checkout")
          git clone --quiet --no-checkout "$repository" "$checkout"
          git -C "$checkout" checkout --quiet --detach "$revision"
          # The clone is of a branch that moves; this is what makes it a pin.
          test "$(git -C "$checkout" rev-parse HEAD)" = "$revision"
          # `--prefix` rather than `cd`: npm runs both the install and the
          # script with that directory as its working directory, and no bash
          # builtin has to be handed a Windows path.
          npm --prefix "$checkout" ci --ignore-scripts
          CONTINUO_REQUIRE_REVISION=1 npm --prefix "$checkout" run build
          test -f "$cli"
          # Printed, so a cell that provisioned the wrong build says so in its
          # own log rather than only as a decoded refusal ten lines later.
          node "$cli" --version
          echo "cli=$cli" >> "$GITHUB_OUTPUT"

      - name: Derive two distinct seeds for this cell
        id: seeds
        shell: bash
        run: |
          set -euo pipefail
          # Derived from the run id, the attempt, and the cell coordinates, so
          # that (a) every cell uses different seeds, (b) a re-run of the same
          # commit exercises different orders rather than replaying the one that
          # happened to be green, and (c) both seeds are printed and therefore
          # replayable.
          cell="${{ matrix.os }}-${{ matrix.node }}"
          mix=$(printf '%s' "$cell" | cksum | cut -d' ' -f1)
          run_id="${{ github.run_id }}"
          attempt="${{ github.run_attempt }}"
          seed_a=$(( (run_id + mix + attempt * 7919) % 2147483647 ))
          seed_b=$(( (seed_a * 31 + 1013904223) % 2147483647 ))
          # The rule is *distinct* seeds. Equality is astronomically unlikely
          # and is still handled, because "two runs at the same seed" is exactly
          # the degenerate case that would void the double-green guarantee.
          if [ "$seed_a" -eq "$seed_b" ]; then
            seed_b=$(( (seed_b + 1) % 2147483647 ))
          fi
          echo "seed_a=$seed_a" >> "$GITHUB_OUTPUT"
          echo "seed_b=$seed_b" >> "$GITHUB_OUTPUT"
          echo "cell=$cell seed_a=$seed_a seed_b=$seed_b"

      - name: Green 1 of 2 (seed ${{ steps.seeds.outputs.seed_a }})
        env:
          RONDO_TEST_SEED: ${{ steps.seeds.outputs.seed_a }}
          # The end-to-end smoke is mandatory in every cell of this matrix: the
          # suite FAILS under CI when this is unset, rather than skipping, so a
          # provisioning step that silently did nothing cannot report green
          # (D-0017 rule 6).
          RONDO_CONTINUO_CLI: ${{ steps.continuo.outputs.cli }}
        # Shuffle itself is configured in vitest.config.ts and is NOT passed on
        # the command line: a CLI flag can be dropped by an edit to this file
        # without any test turning red, which would silently retire the rule
        # (D-0003). CI injects the seed and nothing else.
        run: npm test

      - name: Green 2 of 2 (seed ${{ steps.seeds.outputs.seed_b }})
        # No `if:` guard -- this step is reached only when the first run passed,
        # which is the serial half of the rule. Two green runs at two distinct
        # seeds in the same cell is what "green twice under random ordering"
        # means here.
        env:
          RONDO_TEST_SEED: ${{ steps.seeds.outputs.seed_b }}
          RONDO_CONTINUO_CLI: ${{ steps.continuo.outputs.cli }}
        run: npm test

  checks:
    # Lint and dead-export analysis are platform-independent text checks, so one
    # cell is enough; running them in every matrix cell would only multiply an
    # identical answer. The result still gates the merge -- see `gate`.
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # The digest check runs immediately before the install here too, for the
      # reason the `double-green` job spells out: a warm npm cache can install
      # previously pinned bytes when the committed tarball has drifted, and this
      # is the one step that reports it either way (D-0018 rule 4).
      - run: node vendor/pin.mjs check
      - run: npm ci --ignore-scripts

      - name: Lint and format
        run: npm run lint

      - name: Unused exports and dependencies
        run: npm run knip

      - name: Import boundary check
        # Named separately because this file is what the build exists to defend
        # while rondo has no behaviour yet. It has already run in `double-green`
        # -- twice per cell, under the shuffle -- so this step is visibility,
        # not coverage: it fails loudly and by name if the sweep is ever emptied
        # or moved, rather than passing as one line among many in `npm test`.
        #
        # The seed is explicit because `CI` is set here and an unset seed under
        # CI is a hard error by design (D-0003). A fixed value is right for this
        # step and wrong for the suite: these cases share no state, so ordering
        # proves nothing about them, and `double-green` is where order is
        # actually exercised.
        env:
          RONDO_TEST_SEED: "1"
        run: npx vitest run test/architecture/import-boundaries.test.ts

  boundary-is-not-vacuous:
    # The sweep generates its cases from a directory walk, so the way it fails
    # is by finding nothing and reporting a clean tree. Its own suite guards
    # that from the inside (`PLANTED`, and the walk's floor); this job guards it
    # from the outside, which is the only place a mistake in that machinery can
    # be caught.
    #
    # It plants a real module that breaks two rules at once -- an access-point
    # import from inside the loop, and an HTTP import in a layer granted no
    # externals -- and requires the suite to go RED **with both of those
    # violations named in its output**. A green run here is the failure, and so
    # is a red run that failed for some other reason.
    name: a planted violation makes the boundary test fail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # The digest check runs immediately before the install here too, for the
      # reason the `double-green` job spells out: a warm npm cache can install
      # previously pinned bytes when the committed tarball has drifted, and this
      # is the one step that reports it either way (D-0018 rule 4).
      - run: node vendor/pin.mjs check
      - run: npm ci --ignore-scripts

      - name: Plant a violation and require a red suite
        shell: bash
        env:
          RONDO_TEST_SEED: "1"
        run: |
          set -uo pipefail
          cat > src/refrain/planted-violation.ts <<'PLANTED'
          import { createServer } from "node:http";
          import { describeNextStep } from "../access/local.js";
          export const planted = [createServer, describeNextStep];
          PLANTED
          set +e
          npx vitest run test/architecture/import-boundaries.test.ts 2>&1 | tee planted.log
          status=${PIPESTATUS[0]}
          set -e
          rm -f src/refrain/planted-violation.ts
          if [ "$status" -eq 0 ]; then
            rm -f planted.log
            echo "::error::The boundary test passed with a planted violation in src/refrain/. The sweep is vacuous."
            exit 1
          fi
          # The exit status alone is not the assertion, and treating it as one
          # is how this job would come to certify nothing. A suite that went
          # red for any other reason -- a syntax error, a missing dependency,
          # the parser failing to start -- satisfies `status != 0` while
          # proving nothing about the sweep. So both of the rules the planted
          # module breaks have to appear, by name, in the output.
          missing=0
          grep -q "planted-violation.ts imports the external module node:http" planted.log || missing=1
          grep -q "planted-violation.ts imports ../access/local.js" planted.log || missing=1
          rm -f planted.log
          if [ "$missing" -ne 0 ]; then
            echo "::error::The suite went red, but not with the two violations the planted module contains. Something else is failing, and this job has proved nothing about the sweep."
            exit 1
          fi
          echo "The planted violation was caught, with both expected messages (vitest exited $status)."

  review-is-not-vacuous:
    # D-0029 rule 12. The review stage's whole binding force is that a reading
    # which could not be taken refuses `publish` -- so the way this stage fails
    # is by quietly answering `clear` when it read nothing, which is the exact
    # failure mode the organisation measured in its own reviewer: a clean pass
    # over nothing, indistinguishable from a real one, reported with a zero exit
    # status.
    #
    # A test suite cannot catch that on its own, because a suite that stopped
    # asserting the property would go green for the same reason the property
    # holding does. So this job breaks the property on purpose and requires the
    # suite to go RED **with the named case failing**. A green run here is the
    # failure, and so is a red run that failed for some other reason.
    name: a fail-open reading makes the review test fail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: node vendor/pin.mjs check
      - run: npm ci --ignore-scripts

      - name: Plant a fail-open reading and require a red suite
        shell: bash
        env:
          RONDO_TEST_SEED: "1"
        run: |
          set -uo pipefail
          # Restored from a copy rather than from the index: the restore has to
          # work whether or not the tree is clean, and a job that reached for
          # git to undo its own edit would be one `git` behaviour change away
          # from leaving the mutation in place.
          cp src/access/review.ts "$RUNNER_TEMP/review.ts.orig"
          # The mutation is one word, and it is the one word that matters: a
          # workspace nobody could read is recorded as though it had been read
          # and found fine. `perl -0pi` rather than `sed` so the match spans the
          # four lines that make it unambiguous -- `unavailable` appears
          # elsewhere in the file, and mutating the wrong occurrence would plant
          # a different defect than this job claims to be planting.
          perl -0pi -e 's/verdict: "unavailable",\n      findings: Object\.freeze\(\[\]\),\n      evidence: null,\n      unavailableReason: inspection\.reason,/verdict: "clear",\n      findings: Object.freeze([]),\n      evidence: null,\n      unavailableReason: inspection.reason,/' src/access/review.ts
          if ! grep -q 'verdict: "clear",' src/access/review.ts; then
            cp -f "$RUNNER_TEMP/review.ts.orig" src/access/review.ts
            echo "::error::The planted mutation did not apply. src/access/review.ts has changed shape, so this job is asserting nothing -- re-point it at the branch that maps an unreadable workspace to a verdict."
            exit 1
          fi
          set +e
          npx vitest run test/access/review.test.ts 2>&1 | tee planted.log
          status=${PIPESTATUS[0]}
          set -e
          cp -f "$RUNNER_TEMP/review.ts.orig" src/access/review.ts
          if [ "$status" -eq 0 ]; then
            rm -f planted.log
            echo "::error::The review test passed while an unreadable workspace read as 'clear'. The stage is vacuous: a lap whose work nobody could read would publish as though it had been read."
            exit 1
          fi
          # The exit status alone is not the assertion, for the reason
          # `boundary-is-not-vacuous` gives: a suite that went red because it
          # would not compile satisfies `status != 0` and proves nothing. The
          # named case has to be the one that failed.
          if ! grep -q "a workspace that could not be read is 'unavailable' and never 'clear'" planted.log; then
            rm -f planted.log
            echo "::error::The suite went red, but not on the case this job plants against. Something else is failing, and this job has proved nothing about the reading."
            exit 1
          fi
          rm -f planted.log
          echo "The fail-open reading was caught by its own case (vitest exited $status)."

  gate:
    # The single stable check name, and the one a branch ruleset should require.
    # It exists so that adding a matrix cell does not require editing the
    # ruleset, and so that a SKIPPED or CANCELLED upstream job fails the gate
    # rather than passing it -- `needs` alone treats a skipped dependency as
    # satisfied.
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [double-green, checks, boundary-is-not-vacuous, review-is-not-vacuous]
    steps:
      - name: Every upstream job must have succeeded
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os, sys

          results = json.loads(os.environ["RESULTS"])
          # An allowlist, not a denylist: any result other than `success` --
          # `failure`, `cancelled`, `skipped`, or one GitHub adds later -- is a
          # red gate. `needs` alone would treat a skipped dependency as
          # satisfied, which is the case this job exists to catch.
          bad = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          for name, result in sorted(bad.items()):
              print(f"gate: {name} finished as {result}", file=sys.stderr)
          if bad:
              sys.exit(1)
          print(f"gate: all {len(results)} upstream job(s) succeeded")
